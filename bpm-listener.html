<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BPM Listener</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-height column. Readout ring on top, controls below. Single dark neon theme by choice. */
:root{
  color-scheme: dark;
  --bg:#07060f;
  --panel:#13112b;
  --line:#2b2760;
  --text:#ecebff;
  --dim:#918dc4;
  --cyan:#22e6ff;
  --magenta:#ff2bd6;
  --lime:#b6ff3c;
  --amber:#ffb020;
  --display:"Orbitron","Eurostile","Trebuchet MS",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(120% 60% at 50% 0%, #1b1050 0%, transparent 60%),
    radial-gradient(90% 50% at 50% 100%, #3a0b45 0%, transparent 65%),
    var(--bg);
  color:var(--text);
  font-family:var(--mono);
  font-size:15px;
  display:flex;justify-content:center;
}
main{
  width:100%;max-width:440px;min-height:100%;
  padding:18px 16px 22px;
  display:flex;flex-direction:column;gap:16px;
}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{
  font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:.14em;margin:0;
  color:var(--cyan);text-shadow:0 0 12px rgba(34,230,255,.7);
}
.range{color:var(--dim);font-size:12px;white-space:nowrap}

.ring{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:4px auto 0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .track{stroke:var(--line)}
.ring .prog{
  stroke:var(--magenta);stroke-linecap:round;
  stroke-dasharray:565.5;stroke-dashoffset:565.5;
  filter:drop-shadow(0 0 6px var(--magenta));
  transition:stroke-dashoffset .25s linear;
}
.readout{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;text-align:center;
}
#bpm{
  font-family:var(--display);font-weight:900;font-size:clamp(56px,20vw,84px);line-height:1;
  font-variant-numeric:tabular-nums;
  color:var(--lime);text-shadow:0 0 18px rgba(182,255,60,.65);
}
#bpm.live{color:var(--cyan);text-shadow:0 0 18px rgba(34,230,255,.6)}
#bpm.empty{color:var(--line);text-shadow:none}
.unit{font-family:var(--display);font-weight:600;letter-spacing:.3em;font-size:13px;color:var(--dim)}
#status{font-size:13px;color:var(--text);min-height:1.3em;padding:0 22px}
.pulse{
  width:12px;height:12px;border-radius:50%;background:var(--magenta);opacity:.15;
}
.pulse.on{animation:beat var(--beat,0.5s) linear infinite}
@keyframes beat{0%{opacity:1;box-shadow:0 0 16px 4px var(--magenta)}35%{opacity:.15;box-shadow:none}100%{opacity:.15}}
@media (prefers-reduced-motion:reduce){.pulse.on{animation:none;opacity:.8}.ring .prog{transition:none}}

.meter{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim)}
.meter .bar{flex:1;height:8px;background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--lime) 70%,var(--amber));}
#clarity{min-width:9ch;text-align:right}
#clarity.strong{color:var(--lime)}#clarity.ok{color:var(--cyan)}#clarity.weak{color:var(--amber)}

button{
  font-family:var(--display);font-weight:600;letter-spacing:.08em;
  color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;
  min-height:48px;padding:0 12px;font-size:14px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
button:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
button:active{transform:translateY(1px)}
#go{
  width:100%;min-height:62px;font-size:19px;font-weight:900;letter-spacing:.16em;
  color:#06121a;background:var(--cyan);border-color:var(--cyan);
  box-shadow:0 0 22px rgba(34,230,255,.55);
}
#go.stop{background:var(--magenta);border-color:var(--magenta);color:#1a0416;box-shadow:0 0 22px rgba(255,43,214,.55)}
.row{display:grid;gap:10px}
.row.four{grid-template-columns:repeat(4,1fr)}
.row.two{grid-template-columns:1fr 1fr}
button[aria-pressed="true"]{border-color:var(--lime);color:var(--lime);box-shadow:inset 0 0 12px rgba(182,255,60,.25)}
#tap{border-color:var(--magenta);color:var(--magenta)}
.label{font-size:11px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;margin:2px 0 -8px}
#err{
  display:none;border:1px solid var(--amber);color:var(--amber);background:rgba(255,176,32,.08);
  border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45;
}
#err.show{display:block}
footer{margin-top:auto;color:var(--dim);font-size:12px;line-height:1.5}
</style>
</head>
<body>
<main>
  <header>
    <h1>BPM LISTENER</h1>
    <span class="range">range 70–200</span>
  </header>

  <div class="ring">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle class="track" cx="100" cy="100" r="90"></circle>
      <circle class="prog" id="prog" cx="100" cy="100" r="90"></circle>
    </svg>
    <div class="readout">
      <div class="pulse" id="pulse"></div>
      <div id="bpm" class="empty" aria-live="polite">---</div>
      <div class="unit">BPM</div>
      <div id="status">Hold the phone near the speaker and press Listen.</div>
    </div>
  </div>

  <div class="meter">
    <span>MIC</span>
    <div class="bar"><i id="level"></i></div>
    <span id="clarity">&nbsp;</span>
  </div>

  <div id="err" role="alert"></div>

  <button id="go" type="button">LISTEN</button>

  <div class="label">Listening time / correct the result</div>
  <div class="row four">
    <button id="d10" type="button" aria-pressed="false">10 s</button>
    <button id="d15" type="button" aria-pressed="true">15 s</button>
    <button id="half" type="button" aria-label="Halve the BPM">÷2</button>
    <button id="dbl" type="button" aria-label="Double the BPM">×2</button>
  </div>

  <div class="label">No mic? Tap along to the beat</div>
  <button id="tap" type="button">TAP TEMPO</button>

  <footer>Works best with a clear beat and the music louder than the room. Audio is analysed on this phone and never leaves it.</footer>
</main>

<script id="dsp">
// ---- Signal processing: no DOM in this block ----
var BPM_MIN = 70, BPM_MAX = 200;

// Turns raw samples into an onset envelope (how sharply the energy rises), about 400 values per second.
function makeEnvelope(sampleRate){
  var hop = Math.max(1, Math.round(sampleRate / 400));
  var a = 1 - Math.exp(-2 * Math.PI * 200 / sampleRate); // one-pole low-pass at 200 Hz
  var lp = 0, eLow = 0, eHigh = 0, n = 0, prevLow = 0, prevHigh = 0, first = true;
  var env = [];
  return {
    rate: sampleRate / hop,
    env: env,
    push: function(x){
      for (var i = 0; i < x.length; i++){
        var s = x[i];
        lp += a * (s - lp);
        var h = s - lp;
        eLow += lp * lp; eHigh += h * h;
        if (++n === hop){
          var vl = Math.log(1 + 2000 * eLow / hop), vh = Math.log(1 + 2000 * eHigh / hop);
          if (first){ env.push(0); first = false; }
          else env.push(Math.max(0, vl - prevLow) + Math.max(0, vh - prevHigh));
          prevLow = vl; prevHigh = vh; eLow = 0; eHigh = 0; n = 0;
        }
      }
    }
  };
}

// Finds the tempo whose beat period (and its multiples) best repeats in the envelope.
function estimateBpm(env, rate){
  var n = env.length;
  if (n < rate * 3) return null;
  var mean = 0, i, l;
  for (i = 0; i < n; i++) mean += env[i];
  mean /= n;
  var e = new Float32Array(n);
  for (i = 0; i < n; i++) e[i] = env[i] - mean;

  var maxLag = Math.min(Math.ceil(4 * 60 / BPM_MIN * rate) + 2, Math.floor(n * 0.6));
  var acf = new Float32Array(maxLag + 1);
  for (l = 0; l <= maxLag; l++){
    var s = 0;
    for (i = 0; i + l < n; i++) s += e[i] * e[i + l];
    acf[l] = s / (n - l);
  }
  if (acf[0] <= 1e-9) return null;

  function at(lag){
    var k = Math.floor(lag), f = lag - k;
    if (k + 1 > maxLag) return null;
    return acf[k] * (1 - f) + acf[k + 1] * f;
  }
  var best = -Infinity, bestBpm = 0, bestRaw = 0;
  for (var bpm = BPM_MIN; bpm <= BPM_MAX + 1e-9; bpm += 0.1){
    var p = 60 / bpm * rate, sum = 0, cnt = 0;
    for (var k = 1; k <= 4; k++){
      var v = at(k * p);
      if (v === null) break;
      sum += v; cnt++;
    }
    if (!cnt) continue;
    var raw = sum / cnt / acf[0];
    var oct = Math.log(bpm / 125) / Math.LN2;
    var score = raw * Math.exp(-0.5 * (oct / 0.9) * (oct / 0.9)); // gentle preference for mid tempos
    if (score > best){ best = score; bestBpm = bpm; bestRaw = raw; }
  }
  return { bpm: Math.round(bestBpm * 10) / 10, clarity: bestRaw };
}
</script>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var bpmEl = $('bpm'), statusEl = $('status'), prog = $('prog'), levelEl = $('level'),
      clarityEl = $('clarity'), errEl = $('err'), go = $('go'), pulse = $('pulse');
  var RING = 565.5;
  var duration = 15, base = null, mult = 1;
  var ctx = null, stream = null, node = null, envl = null, samples = 0, lastEst = 0, peak = 0, listening = false, starting = false;

  function showBpm(live){
    if (base === null){ bpmEl.textContent = '---'; bpmEl.className = 'empty'; pulse.classList.remove('on'); return; }
    var v = base * mult;
    bpmEl.textContent = (Math.round(v * 10) / 10).toFixed(1).replace(/\.0$/, '');
    bpmEl.className = live ? 'live' : '';
    pulse.style.setProperty('--beat', (60 / v) + 's');
    pulse.classList.toggle('on', !live);
  }
  function showClarity(c){
    if (c === null){ clarityEl.innerHTML = '&nbsp;'; clarityEl.className = ''; return; }
    var k = c > 0.22 ? 'strong' : c > 0.1 ? 'ok' : 'weak';
    clarityEl.textContent = k === 'strong' ? 'clear beat' : k === 'ok' ? 'fair beat' : 'weak beat';
    clarityEl.className = k;
  }
  function fail(msg){ errEl.textContent = msg; errEl.classList.add('show'); }

  function onSamples(chunk){
    if (!listening) return;
    envl.push(chunk);
    samples += chunk.length;
    for (var i = 0; i < chunk.length; i += 8){ var a = Math.abs(chunk[i]); if (a > peak) peak = a; }
    var t = samples / ctx.sampleRate;
    if (t - lastEst >= 0.5){
      lastEst = t;
      levelEl.style.width = Math.min(100, Math.sqrt(peak) * 140) + '%'; peak = 0;
      prog.style.strokeDashoffset = RING * (1 - Math.min(1, t / duration));
      statusEl.textContent = 'Listening… ' + Math.max(0, Math.ceil(duration - t)) + ' s';
      if (t >= 4){
        var r = estimateBpm(envl.env, envl.rate);
        if (r){ base = r.bpm; showBpm(true); showClarity(r.clarity); }
      }
      if (t >= duration) finish();
    }
  }

  function teardown(){
    listening = false;
    if (node){ try{ node.disconnect(); }catch(e){} node = null; }
    if (stream){ stream.getTracks().forEach(function(tr){ tr.stop(); }); stream = null; }
    if (ctx){ try{ ctx.close(); }catch(e){} ctx = null; }
    levelEl.style.width = '0';
    go.textContent = base === null ? 'LISTEN' : 'LISTEN AGAIN';
    go.classList.remove('stop');
  }

  function finish(){
    var r = envl ? estimateBpm(envl.env, envl.rate) : null;
    teardown();
    if (!r){ statusEl.textContent = 'Not enough sound to measure. Try again closer to the speaker.'; return; }
    base = r.bpm; showBpm(false); showClarity(r.clarity);
    go.textContent = 'LISTEN AGAIN';
    statusEl.textContent = r.clarity > 0.1 ? 'Done. Use ÷2 or ×2 if it feels off.' : 'Weak beat, so treat this as a guess.';
  }

  async function start(){
    if (starting || listening) return;
    starting = true;
    try { await open(); }
    catch(e){ teardown(); fail('Could not start listening (' + (e && e.message || e) + ').'); }
    starting = false;
  }

  async function open(){
    errEl.classList.remove('show');
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      fail('The microphone is blocked here. Open this page from an https:// address or from localhost. A file opened straight from phone storage cannot use the mic. Tap Tempo still works.');
      return;
    }
    try{
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
    }catch(e){
      fail(e && e.name === 'NotAllowedError'
        ? 'Microphone permission was denied. Allow the microphone for this site in the browser settings, then press Listen again.'
        : 'Could not open the microphone (' + (e && e.name || 'error') + '). Close other apps using it and try again.');
      return;
    }
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') await ctx.resume();
    var src = ctx.createMediaStreamSource(stream);
    var mute = ctx.createGain(); mute.gain.value = 0; mute.connect(ctx.destination);
    envl = makeEnvelope(ctx.sampleRate); samples = 0; lastEst = 0; peak = 0;
    base = null; mult = 1; showBpm(true); showClarity(null);
    prog.style.strokeDashoffset = RING;

    var ok = false;
    if (ctx.audioWorklet){
      try{
        var code = 'class T extends AudioWorkletProcessor{process(i){var c=i[0][0];if(c)this.port.postMessage(c.slice());return true}}registerProcessor("tap",T)';
        var url = URL.createObjectURL(new Blob([code], { type:'application/javascript' }));
        await ctx.audioWorklet.addModule(url);
        node = new AudioWorkletNode(ctx, 'tap');
        node.port.onmessage = function(ev){ onSamples(ev.data); };
        ok = true;
      }catch(e){ node = null; console.warn('AudioWorklet unavailable, using fallback:', e && e.message); }
    }
    if (!ok){
      node = ctx.createScriptProcessor(2048, 1, 1);
      node.onaudioprocess = function(ev){ onSamples(ev.inputBuffer.getChannelData(0)); };
    }
    src.connect(node); node.connect(mute);
    listening = true;
    go.textContent = 'STOP'; go.classList.add('stop');
    statusEl.textContent = 'Listening… ' + duration + ' s';
  }

  go.addEventListener('click', function(){
    if (listening){
      if (samples / ctx.sampleRate >= 4) finish();
      else { teardown(); statusEl.textContent = 'Stopped. It needs at least 4 seconds.'; prog.style.strokeDashoffset = RING; }
    } else start();
  });

  function setDur(d){
    duration = d;
    $('d10').setAttribute('aria-pressed', d === 10);
    $('d15').setAttribute('aria-pressed', d === 15);
  }
  $('d10').addEventListener('click', function(){ setDur(10); });
  $('d15').addEventListener('click', function(){ setDur(15); });
  $('half').addEventListener('click', function(){ if (base !== null){ mult /= 2; showBpm(listening); } });
  $('dbl').addEventListener('click', function(){ if (base !== null){ mult *= 2; showBpm(listening); } });

  var taps = [];
  $('tap').addEventListener('pointerdown', function(){
    if (listening) return;
    var now = performance.now();
    if (taps.length && now - taps[taps.length - 1] > 2500) taps = [];
    taps.push(now);
    if (taps.length > 9) taps.shift();
    if (taps.length >= 3){
      base = 60000 * (taps.length - 1) / (taps[taps.length - 1] - taps[0]);
      mult = 1; showBpm(false); showClarity(null);
      statusEl.textContent = 'Tapped tempo. Keep tapping to refine.';
      go.textContent = 'LISTEN';
    } else statusEl.textContent = 'Keep tapping…';
  });
})();
</script>
</body>
</html>
